name: Deploy LION MARKET to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/lion-market-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lion-market-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and verify Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KNOWN_ACCOUNT_ID: "793ead2596b0c84d3d38fbfa5dcbde35"
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          verify_worker_account() {
            local candidate="$1"
            [[ "$candidate" =~ ^[a-fA-F0-9]{32}$ ]] || return 1
            local code
            code="$(curl --silent --show-error --max-time 20 -o /tmp/worker-service.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$candidate/workers/services/lion-market")"
            [ "$code" = "200" ]
          }

          account_id=""
          if verify_worker_account "$CONFIGURED_ACCOUNT_ID"; then
            account_id="$CONFIGURED_ACCOUNT_ID"
            echo "Verified the configured Cloudflare account."
          elif verify_worker_account "$KNOWN_ACCOUNT_ID"; then
            account_id="$KNOWN_ACCOUNT_ID"
            echo "Verified the Cloudflare account ID from the connected dashboard."
          else
            echo "Neither configured account ID resolves the Worker; discovering accessible accounts."
            accounts="$(curl --fail --silent --show-error --max-time 25 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            if [ "$(echo "$accounts" | jq -r '.success')" != "true" ]; then
              echo "::error::Cloudflare rejected account discovery. The API token needs account-read and Workers Scripts Edit access."
              echo "$accounts" | jq -c '.errors // []'
              exit 1
            fi

            matches=()
            while IFS= read -r candidate; do
              if verify_worker_account "$candidate"; then matches+=("$candidate"); fi
            done < <(echo "$accounts" | jq -r '.result[].id')

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Could not uniquely identify the account that owns Worker lion-market."
              echo "$accounts" | jq -r '.result[] | " - " + .id + " | " + .name'
              exit 1
            fi
            account_id="${matches[0]}"
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Verify Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.0 whoami

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.0 deploy
