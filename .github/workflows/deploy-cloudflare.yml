name: Deploy LION MARKET to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/lion-market-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lion-market-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account automatically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The GitHub Actions secret CLOUDFLARE_API_TOKEN is missing. A Cloudflare API token with Workers Scripts Edit permission is required."
            exit 1
          fi

          if [[ "$CONFIGURED_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Using the configured Cloudflare account ID."
            echo "CLOUDFLARE_ACCOUNT_ID=$CONFIGURED_ACCOUNT_ID" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Configured account ID is invalid; discovering accessible Cloudflare accounts."
          accounts="$(curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          if [ "$(echo "$accounts" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare rejected account discovery. Check that the API token can read the account list."
            echo "$accounts" | jq -c '.errors // []'
            exit 1
          fi

          account_count="$(echo "$accounts" | jq '.result | length')"
          if [ "$account_count" -eq 1 ]; then
            account_id="$(echo "$accounts" | jq -r '.result[0].id')"
          else
            matches=()
            while IFS= read -r candidate; do
              code="$(curl --silent --show-error --max-time 20 -o /tmp/worker-service.json -w '%{http_code}' \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$candidate/workers/services/lion-market")"
              if [ "$code" = "200" ]; then matches+=("$candidate"); fi
            done < <(echo "$accounts" | jq -r '.result[].id')

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Could not uniquely identify the Cloudflare account for Worker lion-market."
              echo "Accessible accounts (ID and name):"
              echo "$accounts" | jq -r '.result[] | " - " + .id + " | " + .name'
              echo "Set CLOUDFLARE_ACCOUNT_ID to the account that owns this Worker."
              exit 1
            fi
            account_id="${matches[0]}"
          fi

          if ! [[ "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Cloudflare returned an invalid account identifier."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare account resolved automatically."

      - name: Verify Cloudflare token and account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.0 whoami

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.160.0 deploy
