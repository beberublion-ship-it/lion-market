name: LION MARKET production health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "index.html"
      - "wrangler.jsonc"
      - ".github/workflows/lion-market-health.yml"
  workflow_run:
    workflows: ["Deploy LION MARKET to Cloudflare Workers"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lion-market-production-health
  cancel-in-progress: true

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' --max-time 25 https://lion-market.beberublion.workers.dev/)"
          if [ "$code" != "200" ]; then
            echo "::error::Homepage returned HTTP $code"
            head -c 500 /tmp/home.html || true
            exit 1
          fi
          if ! grep -qi "LION MARKET" /tmp/home.html; then
            echo "::error::Homepage responded but did not contain the LION MARKET title."
            head -c 500 /tmp/home.html || true
            exit 1
          fi
          if ! grep -qi "Transport" /tmp/home.html || ! grep -qi "Déposer une annonce" /tmp/home.html; then
            echo "::error::Homepage is missing a core marketplace feature."
            exit 1
          fi

      - name: Check Worker health and Supabase connection
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/health.json --write-out '%{http_code}' --max-time 25 https://lion-market.beberublion.workers.dev/health)"
          if [ "$code" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $code"
            cat /tmp/health.json || true
            exit 1
          fi
          jq -e '.ok == true and .name == "lion-market" and .database == "supabase"' /tmp/health.json

      - name: Check public WhatsApp configuration
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/config.json --write-out '%{http_code}' --max-time 25 https://lion-market.beberublion.workers.dev/api/config)"
          if [ "$code" != "200" ]; then
            echo "::error::Public configuration API returned HTTP $code"
            cat /tmp/config.json || true
            exit 1
          fi
          jq -e '.whatsappNumber == "237656342697"' /tmp/config.json

      - name: Check public product API
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/products.json --write-out '%{http_code}' --max-time 25 https://lion-market.beberublion.workers.dev/api/products)"
          if [ "$code" != "200" ]; then
            echo "::error::Products API returned HTTP $code"
            cat /tmp/products.json || true
            exit 1
          fi
          jq -e '.products | type == "array"' /tmp/products.json
